# Entorno local completo: MongoDB + API.
#   docker compose up -d --build        → API en http://localhost:8080/health
#   docker compose up -d --scale api=3  → varias instancias (requiere un balanceador delante)
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "27018:27017"   # 27018 para no chocar con el Mongo local instalado
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      VisionLabDatabase__ConnectionString: mongodb://mongo:27017
      VisionLabDatabase__DatabaseName: vision_lab
      Cors__AllowedOrigins__0: http://localhost:4200
    ports:
      - "8080:8080"

volumes:
  mongo-data:
